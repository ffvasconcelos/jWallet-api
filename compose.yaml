name: jwallet

services:
  postgres:
    image: postgres:17
    container_name: jwallet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-jwallet}
      POSTGRES_USER: ${DB_USER:-jwallet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
